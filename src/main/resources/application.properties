spring.application.name=printpilot-api

# Datasource configuration
# As variáveis POSTGRES_* são as mesmas definidas no .env e usadas pelo compose.yaml
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5434}/${POSTGRES_DB:printpilot}
spring.datasource.username=${POSTGRES_USER:printpilot}
spring.datasource.password=${POSTGRES_PASSWORD:printpilot_secret_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# AI Configuration
printpilot.ai.model=${AI_MODEL:gemini-3.5-flash-lite}
google.api-key=${GOOGLE_API_KEY:}
google.genai.use-enterprise=${GOOGLE_GENAI_USE_ENTERPRISE:false}
